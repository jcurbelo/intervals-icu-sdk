name: Release

on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write # OIDC trusted publishing + provenance

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Ensure npm supports trusted publishing (>= 11.5.1)
        run: |
          npm install -g npm@latest
          npm --version

      - name: Check tag matches package.json version
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG="$(node -p "require('./package.json').version")"
          if [ "$TAG" != "$PKG" ]; then
            echo "::error::Release tag v$TAG does not match package.json version $PKG"
            exit 1
          fi

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Publish to npm (trusted publishing)
        # No token: npm authenticates via the workflow's OIDC identity, which is
        # registered as a trusted publisher for this package on npmjs.com.
        # Provenance is generated automatically.
        # prepublishOnly runs typecheck, tests, build, and publint.
        run: npm publish
