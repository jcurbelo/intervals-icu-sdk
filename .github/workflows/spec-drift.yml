name: Spec drift

# Re-fetches the upstream Intervals.icu OpenAPI spec weekly and fails when the
# API changed, so staleness is visible instead of silent.

on:
  schedule:
    - cron: "0 6 * * 1" # Mondays 06:00 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  drift:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Fetch latest spec, normalize, regenerate
        run: |
          bun run spec
          bun run generate

      - name: Report drift
        run: |
          if git diff --quiet -- spec src/gen; then
            echo "No upstream API changes." >> "$GITHUB_STEP_SUMMARY"
          else
            {
              echo "## Upstream Intervals.icu API changed"
              echo ""
              echo '```'
              git diff --stat -- spec src/gen
              echo '```'
              echo ""
              echo "Run \`bun run spec && bun run generate\`, review, and open a PR."
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::error::Upstream spec drifted; see the job summary."
            exit 1
          fi
